services:
  - type: web
    name: broadcast
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: broadcast-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: FROM_NAME
        sync: false
      - key: BRAND_NAME
        sync: false
      - key: STORE_ADDRESS
        sync: false
      - key: DAILY_SEND_LIMIT
        value: "300"

databases:
  - name: broadcast-db
    plan: free
    region: singapore
